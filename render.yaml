services:
  - type: web
    name: harrison-night-exam
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: EXAM_TIMEZONE
        value: Asia/Kabul
      - key: EXAM_START
        value: "20:00"
      - key: EXAM_END
        value: "20:30"
      - key: QUESTION_SECONDS
        value: "25"
      - key: DATABASE_URL
        fromDatabase:
          name: harrison-exam-db
          property: connectionString

databases:
  - name: harrison-exam-db
    plan: free
