<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harrison's Comprehensive Exam</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#172033;font-family:Arial,Tahoma,sans-serif}.wrap{max-width:860px;margin:auto;padding:18px}.card{background:#fff;border-radius:22px;padding:25px;box-shadow:0 8px 30px #0001;margin:16px 0}.hero{text-align:center;padding:34px 25px}.book{font-size:52px}.subtitle{line-height:1.8;color:#59667b}.badge{display:inline-block;background:#eef3ff;color:#2457d6;padding:7px 12px;border-radius:999px;margin:5px}.field{text-align:left;margin:20px 0}.field label{display:block;font-weight:700;margin-bottom:8px}.field input{width:100%;padding:14px;border:2px solid #dce3ee;border-radius:12px;font-size:16px}.btn{border:0;border-radius:12px;padding:13px 20px;background:#2457d6;color:#fff;font-size:16px;cursor:pointer}.btn:disabled{opacity:.55}.center{text-align:center}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.timer{font-weight:800;font-size:20px;padding:9px 13px;border-radius:12px;background:#eef3ff;color:#2457d6}.timer.danger{background:#fff0f0;color:#c62828}.q{font-size:20px;font-weight:700;line-height:1.75;margin:22px 0}.option{display:block;width:100%;text-align:left;border:2px solid #dce3ee;background:#fff;padding:14px;margin:10px 0;border-radius:12px;font-size:16px;cursor:pointer}.option.correct{border-color:#1f9d55;background:#eaf8ef}.option.wrong{border-color:#d64545;background:#fff0f0}.option:disabled{cursor:default}.progress{height:8px;background:#e9edf4;border-radius:9px;overflow:hidden;margin:15px 0}.bar{height:100%;background:#2457d6}.feedback{display:none;padding:15px;border-radius:12px;margin-top:14px;line-height:1.7}.feedback.show{display:block}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:15px;border-radius:14px;background:#f7f9fc;text-align:center}.stat b{display:block;font-size:25px;margin-top:5px}.rank{width:100%;border-collapse:collapse}.rank th,.rank td{padding:11px;border-bottom:1px solid #e6eaf0;text-align:center}.rank th{background:#f7f9fc}.note{font-size:13px;color:#6b7588;line-height:1.7}.locked{font-size:18px;line-height:1.8}@media(max-width:560px){.stats{grid-template-columns:1fr}.q{font-size:18px}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap" id="app"></div><script>
let state={attemptId:null,questions:[],idx:0,answered:false,remaining:25,timer:null,qStarted:0,correct:0,wrong:0};
const $=id=>document.getElementById(id);
async function api(url,opts={}){const r=await fetch(url,{headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});const d=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(d.message||d.error||'Request failed'),{data:d,status:r.status});return d}
function startPage(c){$('app').innerHTML=`<div class="card hero"><div class="book">📚</div><h1>Harrison’s Comprehensive Exam</h1><p class="subtitle"><b>برنامه امتحان شبانه — به مناسبت نه‌ماهگی آیدا ذکی</b></p><p class="subtitle">یک آزمون تخصصی طب داخله بر اساس مباحث Harrison’s Principles of Internal Medicine برای مرور منظم و آمادگی Comprehensive.</p><div><span class="badge">10 Questions</span><span class="badge">25 seconds / question</span><span class="badge">20:00–20:30 Kabul time</span></div><div class="field"><label>Participant name</label><input id="name" placeholder="e.g. Dr. Ezatullah Zaki" maxlength="100"></div><button class="btn" id="startBtn" ${c.inWindow?'':'disabled'}>${c.inWindow?'Start Exam 🚀':'Exam opens at 20:00'}</button><p class="note" id="clock"></p></div>`;$('startBtn').onclick=begin;updateClock(c);}
function updateClock(c){clearInterval(window.clock);const tick=()=>{$('clock').textContent=`Server time: ${new Date().toLocaleTimeString('en-GB',{hour12:false})} · Exam window: ${c.start}–${c.end} (${c.timezone})`;};tick();window.clock=setInterval(tick,1000)}
async function begin(){const name=$('name').value.trim();if(!name)return alert('Please enter your name.');try{const d=await api('/api/start',{method:'POST',body:JSON.stringify({name})});state={...state,attemptId:d.attemptId,questions:d.questions,idx:0,remaining:d.questionSeconds};renderQuestion();}catch(e){alert(e.message)}}
function renderQuestion(){clearInterval(state.timer);state.answered=false;state.remaining=25;state.qStarted=Date.now();const x=state.questions[state.idx];$('app').innerHTML=`<div class="card"><div class="top"><b>Harrison’s Comprehensive Exam</b><div id="timer" class="timer">⏱ 25s</div></div><div class="progress"><div class="bar" style="width:${(state.idx/state.questions.length)*100}%"></div></div><div class="q">Question ${state.idx+1} of ${state.questions.length}<br>${esc(x.q)}</div>${x.o.map((v,i)=>`<button class="option" data-i="${i}">${String.fromCharCode(65+i)}) ${esc(v)}</button>`).join('')}<div id="fb" class="feedback"></div><button id="next" class="btn" style="display:none">${state.idx===state.questions.length-1?'Finish Exam':'Next Question →'}</button></div>`;document.querySelectorAll('.option').forEach(b=>b.onclick=()=>answer(Number(b.dataset.i)));$('next').onclick=next;state.timer=setInterval(()=>{state.remaining--;const t=$('timer');if(t){t.textContent=`⏱ ${state.remaining}s`;if(state.remaining<=5)t.classList.add('danger')}if(state.remaining<=0)answer(null,true)},1000)}
async function answer(sel,timeout=false){if(state.answered)return;state.answered=true;clearInterval(state.timer);const elapsed=Date.now()-state.qStarted;try{const d=await api('/api/answer',{method:'POST',body:JSON.stringify({attemptId:state.attemptId,questionIndex:state.idx,selectedIndex:sel,elapsedMs:elapsed})});if(d.correct)state.correct++;else state.wrong++;document.querySelectorAll('.option').forEach((b,i)=>{b.disabled=true;if(i===d.correctIndex)b.classList.add('correct');if(sel!==null&&i===sel&&sel!==d.correctIndex)b.classList.add('wrong')});const fb=$('fb');fb.innerHTML=d.correct?'✅ Correct.':`❌ Incorrect.${timeout?' Time expired.':''}<br>Correct answer: <b>${String.fromCharCode(65+d.correctIndex)}) ${esc(state.questions[state.idx].o[d.correctIndex])}</b><br>${esc(d.explanation)}`;fb.style.background=d.correct?'#eaf8ef':'#fff0f0';fb.classList.add('show');$('next').style.display='inline-block';}catch(e){state.answered=false;alert(e.message)}}
async function next(){if(state.idx<state.questions.length-1){state.idx++;renderQuestion()}else await finish()}
async function finish(){clearInterval(state.timer);try{const d=await api('/api/finish',{method:'POST',body:JSON.stringify({attemptId:state.attemptId})});showResults(d)}catch(e){alert(e.message)}}
function showResults(d){const r=d.result;$('app').innerHTML=`<div class="card center"><h2>🏁 Exam Result</h2><p><b>${esc(r.name)}</b></p><div class="stats"><div class="stat">Correct<b>${r.correct}</b></div><div class="stat">Wrong<b>${r.wrong}</b></div><div class="stat">Score<b>${r.percent}%</b></div></div><p>🏆 Current rank: <b>#${r.rank}</b></p></div><div class="card"><h2>🏆 Live Ranking</h2><table class="rank"><thead><tr><th>Rank</th><th>Name</th><th>Correct</th><th>Wrong</th><th>Score</th><th>Time</th></tr></thead><tbody>${d.ranking.map(x=>`<tr><td>${x.rank}</td><td>${esc(x.name)}</td><td>${x.correct}</td><td>${x.wrong}</td><td>${x.percent}%</td><td>${(x.durationMs/1000).toFixed(1)}s</td></tr>`).join('')}</tbody></table><p class="note">Ranking is stored centrally on the exam server for the current exam date.</p></div>`}
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function boot(){try{const c=await api('/api/config');if(c.inWindow)startPage(c);else{$('app').innerHTML=`<div class="card hero locked"><div class="book">🔒</div><h1>Harrison’s Comprehensive Exam</h1><p>امتحان در حال حاضر بسته است.</p><p>زمان امتحان: <b>20:00 تا 20:30</b> به وقت افغانستان.</p><p id="wait"></p></div>`;setInterval(async()=>{const n=await api('/api/config');if(n.inWindow)location.reload();$('wait').textContent=`Server time: ${new Date(n.serverNow).toLocaleTimeString('en-GB',{hour12:false})}`},1000)}}catch(e){$('app').innerHTML=`<div class="card"><h2>Connection error</h2><p>${esc(e.message)}</p></div>`}}boot();
</script></body></html>
